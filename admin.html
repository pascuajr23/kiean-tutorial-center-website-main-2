<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Teacher availability | KieAn Tutorial Center</title>
  <link rel="icon" href="assets/kiean-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..900&amp;family=Nunito:wght@700..900&amp;display=swap">
  <link rel="stylesheet" href="style.css?v=20261028-18">
  <link rel="stylesheet" href="admin.css?v=20261028-18">
  <link rel="stylesheet" href="admin-responsive.css?v=20261028-18">
</head>
<body class="admin-page">
  <header class="admin-header">
    <a href="/" aria-label="KieAn home"><img src="assets/kiean-logo.webp" width="300" height="143" alt="KieAn Tutorial Center"></a>
  </header>
  <main class="admin-main">
    <div class="admin-heading">
      <div><span class="admin-kicker">CENTER OPERATIONS</span><h1>Teacher availability</h1><p>Roster settings for the public booking calendar.</p></div>
      <div class="roster-stats" aria-live="polite"><span><strong id="teacher-count">—</strong> teachers</span><span><strong id="bookable-count">—</strong> ready to book</span></div>
    </div>
    <section class="center-account" aria-labelledby="center-title">
      <div><h2 id="center-title">Center Google account</h2><p>Sends booking emails and the online-lesson invitations with Google Meet links.</p></div>
      <div class="center-account-status"><span id="center-state" class="connection-state" data-connected="false"><span class="connection-dot"></span><span>Checking…</span></span><a id="center-connect" class="button button-secondary" href="/api/center/google/connect">Connect</a></div>
    </section>
    <div id="admin-message" class="admin-message" role="status" aria-live="polite">Loading teacher roster…</div>
    <form id="roster-form" hidden>
      <div id="teacher-list" class="teacher-list"></div>
      <div class="admin-actions">
        <button id="back-to-list" class="button button-secondary" type="button" hidden><span aria-hidden="true">←</span> All teachers</button>
        <button id="add-teacher" class="button button-secondary" type="button"><span aria-hidden="true">+</span> Add teacher</button>
        <button id="save-roster" class="button button-primary" type="submit" hidden>Save teacher</button>
      </div>
    </form>
  </main>
  <script type="module" src="admin.js?v=20261028-18"></script>
</body>
</html>
